databases:
  - name: hotel-db
    plan: free
    region: singapore

services:
  - type: web
    name: hotel-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromService:
          type: postgresql
          name: hotel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: IS_PRODUCTION
        value: "true"
      - key: FRONTEND_URL
        value: https://hotel-frontend.onrender.com

  - type: web
    name: hotel-frontend
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NUXT_PUBLIC_API_BASE
        value: https://hotel-backend.onrender.com
